name: .NET CI Pipeline (NUnit)
on: 
  push: 
    branches: ["main", "ai-version-1", "ai-version-2", "ai-version-3"]
  pull_request: 
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # ШАГ 1: Настройка Python для генератора
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      # ШАГ 2: Генерация тестов (в папке ai-version-1)
      - name: Generate NUnit tests
        run: python generator/gen_tests.py --config config.yaml
        working-directory: ai-version-1
      
      # ШАГ 3: Настройка .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      # ШАГ 4: Восстановление зависимостей
      - name: Restore dependencies
        run: dotnet restore
      
      # ШАГ 5: Сборка
      - name: Build
        run: dotnet build --no-restore --configuration Release
      
      # ШАГ 6: Запуск тестов
      - name: Test
        run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
      # ШАГ 7: Публикация результатов
      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nunit-test-results-${{ github.ref_name }}
          path: |
            ai-version-1/tests/Module.Tests/TestResults/
            ai-version-1/tests/Module.Tests/*.trx
