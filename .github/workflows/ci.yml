name: .NET CI Pipeline (NUnit)
on:
  push:
    branches: ["main", "ai-version-1", "ai-version-2", "ai-version-3"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. АВТОМАТИЧЕСКИ ОПРЕДЕЛЯЕМ ПАПКУ С КОДОМ
      # Если ветка ai-version-1, то работаем в папке ai-version-1
      # Если main, то работаем в корне (.)
      - name: Set Working Directory
        id: set-dir
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          if [[ "$BRANCH" == ai-version-* ]]; then
            echo "dir=$BRANCH" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      # 2. Python Setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pyyaml

      # 3. Генерация тестов (в нужной папке)
      - name: Generate NUnit tests
        run: python generator/gen_tests.py --config config.yaml
        working-directory: ${{ steps.set-dir.outputs.dir }}

      # 4. .NET Setup
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      # 5. Восстановление зависимостей и сборка
      - name: Restore & Build
        run: |
          # Восстанавливаем зависимости для тестового проекта (он подтянет и основной)
          dotnet restore tests/Module.Tests/Module.Tests.csproj
          
          # Собираем тестовый проект
          dotnet build tests/Module.Tests/Module.Tests.csproj --no-restore --configuration Release
        working-directory: ${{ steps.set-dir.outputs.dir }}

      # 6. Загрузка результатов
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.set-dir.outputs.dir }}
          path: |
            ${{ steps.set-dir.outputs.dir }}/tests/Module.Tests/TestResults/
            ${{ steps.set-dir.outputs.dir }}/tests/Module.Tests/*.trx
