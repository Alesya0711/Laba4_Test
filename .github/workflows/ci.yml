name: .NET CI Pipeline (NUnit)
on: 
  push: 
    branches: ["main", "ai-version-1", "ai-version-2", "ai-version-3"]
  pull_request: 
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Determine working directory
        id: dirs
        run: |
          if [ -d "ai-version-1" ]; then
            echo "dir=ai-version-1" >> $GITHUB_OUTPUT
          elif [ -d "ai-version-2" ]; then
            echo "dir=ai-version-2" >> $GITHUB_OUTPUT
          elif [ -d "ai-version-3" ]; then
            echo "dir=ai-version-3" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi
      
      - name: Restore dependencies
        run: dotnet restore tests/Module.Tests/Module.Tests.csproj
        working-directory: ${{ steps.dirs.outputs.dir }}
      
      - name: Build
        run: dotnet build tests/Module.Tests/Module.Tests.csproj --no-restore
        working-directory: ${{ steps.dirs.outputs.dir }}
      
      - name: Test
        run: dotnet test tests/Module.Tests/Module.Tests.csproj --no-build --verbosity normal --logger "console;verbosity=detailed"
        working-directory: ${{ steps.dirs.outputs.dir }}
      
      - name: Publish Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: nunit-test-results-${{ github.ref_name }}
          path: '**/*.trx'
