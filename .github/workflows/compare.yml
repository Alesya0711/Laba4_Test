name: Comparative Test Report
on: 
  workflow_dispatch:

jobs:
  test-ai-v1:
    name: Test AI Version 1 (Qwen)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-version-1
    steps:
      - uses: actions/checkout@v3
        with: 
          ref: ai-version-1
      - uses: actions/setup-dotnet@v3
        with: 
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore tests/Module.Tests/Module.Tests.csproj
      
      - name: Build
        run: dotnet build tests/Module.Tests/Module.Tests.csproj --no-restore
      
      - name: Test
        run: dotnet test tests/Module.Tests/Module.Tests.csproj --no-build --verbosity normal

  test-ai-v2:
    name: Test AI Version 2 (DeepSeek)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-version-2
    steps:
