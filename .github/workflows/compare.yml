name: Comparative Test Report
on: 
  workflow_dispatch:

jobs:
  test-ai-v1:
    name: Test AI Version 1 (Qwen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: { ref: ai-version-1 }
      - uses: actions/setup-dotnet@v3
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  test-ai-v2:
    name: Test AI Version 2 (DeepSeek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: { ref: ai-version-2 }
      - uses: actions/setup-dotnet@v3
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal

  test-ai-v3:
    name: Test AI Version 3 (GigaChat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with: { ref: ai-version-3 }
      - uses: actions/setup-dotnet@v3
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --verbosity normal