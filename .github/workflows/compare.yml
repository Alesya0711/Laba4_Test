        with: 
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        run: dotnet restore tests/Module.Tests/Module.Tests.csproj
      
      - name: Build
        run: dotnet build tests/Module.Tests/Module.Tests.csproj --no-restore
      
      - name: Test
        run: dotnet test tests/Module.Tests/Module.Tests.csproj --no-build --verbosity normal

  test-ai-v3:
    name: Test AI Version 3 (GigaChat)
    runs-on: ubuntu-latest
    defaults:
